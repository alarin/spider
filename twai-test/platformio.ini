[env:twai-test-c3]
upload_port = /dev/cu.usbmodem2101
platform = espressif32
board = esp32-c3-devkitc-02
framework = espidf
lib_deps = 
	../libs/twai_proto

[env:twai-test-s3]
upload_port = /dev/cu.usbmodem2101
platform = espressif32
board = lolin_s3_mini
framework = espidf
lib_deps = 
	../libs/twai_proto
